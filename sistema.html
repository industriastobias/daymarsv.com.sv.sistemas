<script>
/* === 1) Pega aquí los datos de tu proyecto (Supabase → Project Settings → API) === */
const CFG={url:"https://itafqiemoulcztmhfqah.supabase.co",key:"sb_publishable_gkdG2OvACj7eGxaa5JSsLw_wO7w0bEB"};

(function(){
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $$=n=>"$"+Number(n||0).toLocaleString("es-SV",{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=t=>new Date(t).toLocaleString("es-SV",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const ymd=d=>d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3200)};
try{const th=localStorage.getItem("dms_th");if(th)document.documentElement.dataset.theme=th}catch(e){}
$("th").onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark";try{localStorage.setItem("dms_th",r.dataset.theme)}catch(e){}};
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>$(b.dataset.x).close());
if(CFG.url.indexOf("PEGA")>-1||typeof supabase==="undefined"){$("le").textContent="Falta configurar Supabase: abre index.html y pega tu Project URL y tu anon key en CFG (mira LEEME.md).";$("lb").disabled=true;$("sw").disabled=true;return}
const db=supabase.createClient(CFG.url,CFG.key);
const ok=async p=>{const r=await p;if(r.error){toast(r.error.message);throw r.error}return r.data};
let me=null,S={prods:[],cats:[],provs:[],clis:[]},cart={},mode="in",ed=null,mid=null,ck="clientes",ceid=null,photo=null;
const find=id=>S.prods.find(p=>p.id===id);
const catName=id=>(S.cats.find(c=>c.id===id)||{}).nombre||"Sin categoría";
const pic=(p,c)=>p.foto_url?`<img class="${c}" src="${esc(p.foto_url)}" alt="${esc(p.nombre)}" loading="lazy">`:`<div class="${c}">${esc(p.nombre.charAt(0).toUpperCase())}</div>`;
const st=p=>p.stock<=0?["out","Agotado"]:p.stock<=p.stock_minimo?["low","Stock bajo"]:["ok","Disponible"];

/* ---------- Sesión ---------- */
$("sw").onclick=()=>{mode=mode==="in"?"up":"in";$("lb").textContent=mode==="in"?"Ingresar":"Crear cuenta";$("sw").textContent=mode==="in"?"Crear cuenta":"Ya tengo cuenta";$("le").textContent=""};
$("lf").onsubmit=async e=>{e.preventDefault();$("le").textContent="";$("lb").disabled=true;
 const email=$("u").value.trim(),pw=$("p").value;
 const {data,error}=mode==="in"?await db.auth.signInWithPassword({email,password:pw}):await db.auth.signUp({email,password:pw,options:{data:{nombre:email.split("@")[0]}}});
 $("lb").disabled=false;
 if(error){$("le").textContent=error.message.indexOf("Invalid login")>-1?"Correo o contraseña incorrectos.":error.message;return}
 if(!data.session){$("le").textContent="Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.";return}
 $("p").value="";boot()};
$("out").onclick=async()=>{await db.auth.signOut();location.replace("index.html")};
db.auth.getSession().then(({data})=>{if(data.session)boot();else location.replace("index.html")});
async function boot(){try{const {data:u}=await db.auth.getUser();
 me=await ok(db.from("profiles").select("*").eq("id",u.user.id).single());
 if(!me.activo){await db.auth.signOut();$("le").textContent="Tu usuario está desactivado. Habla con el administrador.";return}
 document.body.dataset.rol=me.rol;$("login").classList.add("hidden");$("app").classList.remove("hidden");
 await loadAll();const h=location.hash.slice(1);view(VS.indexOf(h)>-1?h:"dash")}catch(e){toast("No se pudo cargar tu perfil. ¿Ejecutaste schema.sql completo?")}}
async function loadAll(){const [c,pv,p,cl]=await Promise.all([ok(db.from("categorias").select("*").order("nombre")),ok(db.from("proveedores").select("*").order("nombre")),ok(db.from("productos").select("*").eq("activo",true).order("nombre")),ok(db.from("clientes").select("*").order("nombre"))]);S.cats=c;S.provs=pv;S.prods=p;S.clis=cl}

/* ---------- Navegación ---------- */
const VS=["dash","inv","pos","cli","prov","rep","his"];
const R={dash:()=>rDash(),inv:()=>rInv(),pos:()=>rPos(),cli:()=>rCont("clientes"),prov:()=>rCont("proveedores"),rep:()=>rRep(),his:()=>rHis()};
async function view(v){VS.forEach(n=>$("v-"+n).classList.toggle("hidden",n!==v));document.querySelectorAll("nav .t").forEach(b=>b.classList.toggle("on",b.dataset.v===v));try{await R[v]()}catch(e){}scrollTo(0,0)}
document.querySelectorAll("nav .t").forEach(b=>b.onclick=()=>view(b.dataset.v));

/* ---------- Panel ---------- */
function donut(cat){const ks=Object.keys(cat);if(!ks.length)return'<div class="em">Sin productos todavía.</div>';const pal=["#6B2D3E","#C9973F","#a24560","#2f7d4f","#4a6fa5","#b4531a"],tot=ks.reduce((a,k)=>a+cat[k],0)||1;let acc=0;
 const seg=ks.map((k,i)=>{const x=acc/tot*100;acc+=cat[k];return pal[i%6]+" "+x+"% "+(acc/tot*100)+"%"}).join(",");
 return`<div class="dn"><div class="ring" style="background:conic-gradient(${seg})"><span>${$$(tot)}</span></div><div>${ks.map((k,i)=>`<div class="lg"><i style="background:${pal[i%6]}"></i>${esc(k)} <b>${Math.round(cat[k]/tot*100)}%</b></div>`).join("")}</div></div>`}
async function rDash(){const hr=new Date().getHours();$("gr").textContent=(hr<12?"Buenos días":hr<19?"Buenas tardes":"Buenas noches")+", "+me.nombre;$("dtx").textContent=new Date().toLocaleDateString("es-SV",{weekday:"long",day:"numeric",month:"long"});
 const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6);
 const [vd,top]=await Promise.all([ok(db.from("vista_ventas_diarias").select("*").gte("fecha",ymd(d0))),ok(db.from("vista_top_productos").select("*").limit(5))]);
 const map={};vd.forEach(x=>map[x.fecha]=x);const days=[];for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);days.push({l:d.toLocaleDateString("es-SV",{weekday:"short"}),v:+(map[ymd(d)]||{}).total||0})}
 const wk=sum(days,"v"),mx=Math.max(...days.map(x=>x.v))||1,val=S.prods.reduce((a,p)=>a+p.stock*p.precio_venta,0),low=S.prods.filter(p=>p.stock<=p.stock_minimo),cat={};
 S.prods.forEach(p=>{const c=catName(p.categoria_id);cat[c]=(cat[c]||0)+p.stock*p.precio_venta});
 $("dash").innerHTML=`<div class="grid st"><div class="c big k"><b>${$$(days[6].v)}</b><span>Ventas de hoy</span></div><div class="c k"><b>${$$(wk)}</b><span>Ventas, últimos 7 días</span></div><div class="c k"><b>${$$(val)}</b><span>Valor del inventario</span></div><div class="c k w"><b>${low.length}</b><span>Productos con stock bajo</span></div></div>
 <div class="grid two" style="margin-top:12px"><div class="c"><h3>Ventas por día</h3><div class="chart">${days.map(x=>`<div title="${$$(x.v)}"><i style="height:${Math.round(x.v/mx*100)}%"></i>${esc(x.l)}</div>`).join("")}</div></div><div class="c"><h3>Valor por categoría</h3>${donut(cat)}</div></div>
 <div class="grid two" style="margin-top:12px"><div class="c"><h3>Más vendidos (30 días)</h3>${top.length?top.map(n=>`<div class="li"><span>${esc(n.nombre)}</span><b>${n.unidades} uds.</b></div>`).join(""):'<div class="em">Registra ventas para ver el ranking.</div>'}</div>
 <div class="c"><h3>Por reponer</h3>${low.length?low.map(p=>`<div class="li"><span>${esc(p.nombre)}</span><span class="tag ${st(p)[0]}">${p.stock} uds.</span></div>`).join(""):'<div class="em">Todo el stock está en orden.</div>'}</div></div>`}

/* ---------- Inventario ---------- */
function rInv(){const cur=$("cf").value;$("cf").innerHTML='<option value="">Todas las categorías</option>'+S.cats.map(c=>`<option value="${c.id}"${c.id===cur?" selected":""}>${esc(c.nombre)}</option>`).join("");
 $("cats").innerHTML=S.cats.map(c=>`<option value="${esc(c.nombre)}">`).join("");
 const q=$("q").value.trim().toLowerCase(),cf=$("cf").value,l=S.prods.filter(p=>(!cf||p.categoria_id===cf)&&(!q||((p.nombre||"")+" "+(p.codigo||"")).toLowerCase().indexOf(q)>-1));
 $("inv").innerHTML=l.length?'<div class="pg">'+l.map(p=>{const s=st(p);return`<div class="pc">${pic(p,"pi")}<div class="pb"><h3>${esc(p.nombre)}</h3><small>${esc(catName(p.categoria_id))}${p.codigo?" · "+esc(p.codigo):""}</small><b>${$$(p.precio_venta)}</b><span class="tag ${s[0]}">${s[1]}: ${p.stock}</span><div class="ac adm"><button class="btn s" data-a="m" data-i="${p.id}">Stock</button><button class="btn g s" data-a="e" data-i="${p.id}">Editar</button><button class="btn g s" data-a="d" data-i="${p.id}">Eliminar</button></div></div></div>`}).join("")+"</div>":`<div class="c em">${S.prods.length?"Ningún producto coincide con la búsqueda.":"Aún no hay productos. Presiona “Agregar producto” para crear el primero."}</div>`}
$("q").oninput=rInv;$("cf").onchange=rInv;
$("inv").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const p=find(b.dataset.i);if(!p)return;
 if(b.dataset.a==="e")openP(p);else if(b.dataset.a==="m"){mid=p.id;$("mt").textContent="Stock de "+p.nombre;$("m2").value="";$("m3").value="";$("md").showModal();$("m2").focus()}
 else if(confirm(`¿Eliminar “${p.nombre}”? Sus ventas anteriores se conservan.`)){try{await ok(db.from("productos").update({activo:false,eliminado_en:new Date().toISOString()}).eq("id",p.id));delete cart[p.id];await loadAll();rInv();toast("Producto eliminado")}catch(x){}}};
function openP(p){ed=p?p.id:null;photo=null;$("pt").textContent=p?"Editar producto":"Agregar producto";
 $("f4").innerHTML='<option value="">Sin proveedor</option>'+S.provs.map(v=>`<option value="${v.id}"${p&&p.proveedor_id===v.id?" selected":""}>${esc(v.nombre)}</option>`).join("");
 $("f1").value=p?p.nombre:"";$("f2").value=p&&p.codigo||"";$("f3").value=p?catName(p.categoria_id).replace("Sin categoría",""):"";$("f5").value=p?p.precio_costo:"";$("f6").value=p?p.precio_venta:"";$("f7").value=0;$("f7").disabled=!!p;$("f8").value=p?p.stock_minimo:3;$("f9").value="";
 $("pv").src=p&&p.foto_url||"";$("pv").classList.toggle("hidden",!(p&&p.foto_url));$("pd").showModal();$("f1").focus()}
$("add").onclick=()=>openP(null);
$("f9").onchange=function(){const f=this.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{photo=b;$("pv").src=URL.createObjectURL(b);$("pv").classList.remove("hidden")},"image/jpeg",.8)};im.src=URL.createObjectURL(f)};
$("pf").onsubmit=async e=>{e.preventDefault();$("pg").disabled=true;try{
 let cid=null;const cn=$("f3").value.trim();if(cn){let c=S.cats.find(x=>x.nombre.toLowerCase()===cn.toLowerCase());if(!c)c=await ok(db.from("categorias").insert({nombre:cn}).select().single());cid=c.id}
 const o={nombre:$("f1").value.trim(),codigo:$("f2").value.trim()||null,categoria_id:cid,proveedor_id:$("f4").value||null,precio_costo:+$("f5").value||0,precio_venta:+$("f6").value||0,stock_minimo:parseInt($("f8").value,10)||0};
 if(photo){const path=crypto.randomUUID()+".jpg";await ok(db.storage.from("productos").upload(path,photo,{contentType:"image/jpeg"}));o.foto_url=db.storage.from("productos").getPublicUrl(path).data.publicUrl}
 if(ed)await ok(db.from("productos").update(o).eq("id",ed));
 else{const n=await ok(db.from("productos").insert(o).select().single()),q=parseInt($("f7").value,10)||0;if(q>0)await ok(db.rpc("registrar_movimiento",{p_producto:n.id,p_tipo:"entrada",p_cantidad:q,p_nota:"Stock inicial"}))}
 $("pd").close();await loadAll();rInv();toast("Producto guardado")}catch(x){}finally{$("pg").disabled=false}};
$("mf").onsubmit=async e=>{e.preventDefault();try{await ok(db.rpc("registrar_movimiento",{p_producto:mid,p_tipo:$("m1").value,p_cantidad:parseInt($("m2").value,10)||0,p_nota:$("m3").value.trim()||null}));$("md").close();await loadAll();rInv();toast("Movimiento registrado")}catch(x){}};

/* ---------- Vender ---------- */
function rPos(){const q=$("pq").value.trim().toLowerCase(),l=S.prods.filter(p=>p.stock>0&&(!q||((p.nombre||"")+" "+(p.codigo||"")).toLowerCase().indexOf(q)>-1));
 $("pgrid").innerHTML=l.length?l.map(p=>`<button class="pp" data-i="${p.id}">${pic(p,"pi")}<div><b>${esc(p.nombre)}</b><br>${$$(p.precio_venta)} · ${p.stock} disp.</div></button>`).join(""):'<div class="c em" style="grid-column:1/-1">No hay productos con stock para vender.</div>';
 const ids=Object.keys(cart).filter(find);let tot=0;
 $("cart").innerHTML=ids.length?ids.map(i=>{const p=find(i);tot+=p.precio_venta*cart[i];return`<div class="cr"><span>${esc(p.nombre)}<br><small class="mu">${$$(p.precio_venta)}</small></span><button data-c="-" data-i="${i}" aria-label="Quitar una">−</button><b>${cart[i]}</b><button data-c="+" data-i="${i}" aria-label="Agregar una">+</button></div>`}).join(""):'<div class="em">Toca un producto para agregarlo a la venta.</div>';
 const cur=$("cl").value;$("cl").innerHTML='<option value="">Consumidor final</option>'+S.clis.map(c=>`<option value="${c.id}"${c.id===cur?" selected":""}>${esc(c.nombre)}</option>`).join("");
 const dc=Math.min(100,Math.max(0,parseFloat($("dc").value)||0));$("tt").textContent=$$(tot*(1-dc/100))}
$("pq").oninput=rPos;$("dc").oninput=rPos;
$("pgrid").onclick=e=>{const b=e.target.closest(".pp");if(!b)return;const p=find(b.dataset.i);if((cart[p.id]||0)<p.stock)cart[p.id]=(cart[p.id]||0)+1;else toast("No hay más unidades de "+p.nombre);rPos()};
$("cart").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=b.dataset.i,p=find(i);if(b.dataset.c==="+"){if(cart[i]<p.stock)cart[i]++;else toast("No hay más unidades de "+p.nombre)}else if(--cart[i]<=0)delete cart[i];rPos()};
$("go").onclick=async()=>{const ids=Object.keys(cart);if(!ids.length){toast("Agrega productos a la venta primero");return}
 $("go").disabled=true;try{const dc=Math.min(100,Math.max(0,parseFloat($("dc").value)||0)),cid=$("cl").value||null;
 const lines=ids.map(i=>{const p=find(i);return{n:p.nombre,q:cart[i],pr:+p.precio_venta}});
 const id=await ok(db.rpc("registrar_venta",{p_cliente:cid,p_items:ids.map(i=>({producto_id:i,cantidad:cart[i]})),p_descuento:dc,p_metodo:$("pay").value}));
 const v=await ok(db.from("ventas").select("numero,subtotal,total,descuento_pct,metodo_pago,created_at,clientes(nombre)").eq("id",id).single());
 cart={};$("dc").value=0;await loadAll();rPos();ticket(v,lines);toast("Venta cobrada: "+$$(v.total))}catch(x){}finally{$("go").disabled=false}};
function ticket(v,lines){$("tkb").innerHTML=`<div style="text-align:center"><div class="brand" style="color:var(--wine)">DAYMARSHOP</div><small>Ticket #${v.numero} · ${fd(v.created_at)}</small></div><hr>${v.clientes?`<p style="margin:0 0 6px">Cliente: ${esc(v.clientes.nombre)}</p>`:""}${lines.map(l=>`<div class="li"><span>${l.q} × ${esc(l.n)}</span><b>${$$(l.q*l.pr)}</b></div>`).join("")}<div class="li"><span>Subtotal</span><span>${$$(v.subtotal)}</span></div>${+v.descuento_pct?`<div class="li"><span>Descuento ${+v.descuento_pct}%</span><span>−${$$(v.subtotal-v.total)}</span></div>`:""}<div class="tot"><span>Total</span><span>${$$(v.total)}</span></div><p style="text-align:center;margin:0">Pago: ${esc(v.metodo_pago)}<br>¡Gracias por tu compra!</p>`;$("tk").showModal()}
$("pr").onclick=()=>{try{print()}catch(e){toast("No se pudo imprimir")}};

/* ---------- Clientes y proveedores ---------- */
async function rCont(kind){const isC=kind==="clientes",list=isC?S.clis:S.provs,box=$(isC?"cli":"prov"),tot={};
 if(isC){const v=await ok(db.from("ventas").select("cliente_id,total,created_at").eq("estado","completada").not("cliente_id","is",null));v.forEach(x=>{const o=tot[x.cliente_id]||(tot[x.cliente_id]={n:0,t:0,l:0});o.n++;o.t+=+x.total;o.l=Math.max(o.l,new Date(x.created_at).getTime())})}
 box.innerHTML=list.length?'<div class="pg" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">'+list.map(c=>{let ph=String(c.telefono||"").replace(/\D/g,"");if(ph.length===8)ph="503"+ph;const o=tot[c.id];
 return`<div class="c"><div style="display:flex;gap:10px;align-items:center"><div class="av">${esc(c.nombre.charAt(0).toUpperCase())}</div><div><h3>${esc(c.nombre)}</h3><small class="mu">${esc(c.telefono||c.correo||"Sin contacto")}</small></div></div>${isC?`<p style="margin:10px 0 2px">${o?o.n:0} compras · <b>${$$(o?o.t:0)}</b></p><small class="mu">${o?"Última: "+fd(o.l):"Aún no ha comprado"}</small>`:""}${c.notas?`<p style="margin:6px 0 0">${esc(c.notas)}</p>`:""}<div class="ac">${ph?`<a class="btn s" style="text-decoration:none;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="https://wa.me/${ph}">WhatsApp</a>`:""}<button class="btn g s${isC?"":" adm"}" data-a="e" data-i="${c.id}">Editar</button><button class="btn g s adm" data-a="d" data-i="${c.id}">Eliminar</button></div></div>`}).join("")+"</div>":`<div class="c em">Aún no hay registros. Presiona “Agregar” para crear el primero.</div>`}
function openC(kind,row){ck=kind;ceid=row?row.id:null;$("nt").textContent=(row?"Editar ":"Agregar ")+(kind==="clientes"?"cliente":"proveedor");$("n1").value=row?row.nombre:"";$("n2").value=row&&row.telefono||"";$("n3").value=row&&row.correo||"";$("n4").value=row&&row.notas||"";$("cd").showModal();$("n1").focus()}
$("addc").onclick=()=>openC("clientes");$("addp").onclick=()=>openC("proveedores");
const holder=id=>$(id).onclick=async e=>{const b=e.target.closest("button");if(!b)return;const kind=id==="cli"?"clientes":"proveedores",row=(kind==="clientes"?S.clis:S.provs).find(x=>x.id===b.dataset.i);if(!row)return;
 if(b.dataset.a==="e")openC(kind,row);else if(confirm(`¿Eliminar a “${row.nombre}”?`)){try{await ok(db.from(kind).delete().eq("id",row.id));await loadAll();rCont(kind);toast("Eliminado")}catch(x){}}};
holder("cli");holder("prov");
$("nf").onsubmit=async e=>{e.preventDefault();const o={nombre:$("n1").value.trim(),telefono:$("n2").value.trim()||null,correo:$("n3").value.trim()||null,notas:$("n4").value.trim()||null};if(!o.nombre)return;
 try{await ok(ceid?db.from(ck).update(o).eq("id",ceid):db.from(ck).insert(o));$("cd").close();await loadAll();rCont(ck);toast("Guardado")}catch(x){}};

/* ---------- Reportes ---------- */
async function rRep(){if(!$("r2").value){const n=new Date();$("r2").value=ymd(n);$("r1").value=ymd(new Date(n.getFullYear(),n.getMonth(),n.getDate()-29))}
 const f=new Date($("r1").value+"T00:00:00").toISOString(),t=new Date($("r2").value+"T23:59:59").toISOString();
 const all=await ok(db.from("ventas").select("id,numero,subtotal,total,costo_total,metodo_pago,estado,created_at,clientes(nombre),venta_items(cantidad,precio_unit,productos(nombre))").gte("created_at",f).lte("created_at",t).order("created_at",{ascending:false}));
 const l=all.filter(x=>x.estado==="completada"),tot=sum(l,"total"),gan=tot-sum(l,"costo_total"),ds=sum(l,"subtotal")-tot,pay={},prod={};
 l.forEach(x=>{pay[x.metodo_pago]=(pay[x.metodo_pago]||0)+ +x.total;x.venta_items.forEach(y=>{const n=y.productos?y.productos.nombre:"(eliminado)",o=prod[n]||(prod[n]={q:0,v:0});o.q+=y.cantidad;o.v+=y.cantidad*y.precio_unit})});
 const pm=Math.max(...Object.keys(pay).map(k=>pay[k]),1),pk=Object.keys(prod).sort((a,b)=>prod[b].v-prod[a].v);
 $("rep").innerHTML=`<div class="grid st"><div class="c big k"><b>${$$(tot)}</b><span>Ventas del período</span></div><div class="c k"><b>${l.length}</b><span>Número de ventas</span></div><div class="c k adm"><b>${$$(gan)}</b><span>Ganancia estimada</span></div><div class="c k"><b>${$$(ds)}</b><span>Descuentos dados</span></div></div>
 <div class="grid two" style="margin-top:12px"><div class="c tw"><h3>Ventas por producto</h3>${pk.length?`<table><thead><tr><th>Producto</th><th>Unidades</th><th>Ingresos</th></tr></thead><tbody>${pk.map(n=>`<tr><td>${esc(n)}</td><td>${prod[n].q}</td><td>${$$(prod[n].v)}</td></tr>`).join("")}</tbody></table>`:'<div class="em">No hay ventas en estas fechas.</div>'}</div>
 <div class="c"><h3>Forma de pago</h3>${Object.keys(pay).length?Object.keys(pay).map(k=>`<div class="hb"><p><span>${esc(k)}</span><span>${$$(pay[k])}</span></p><s><i style="width:${Math.round(pay[k]/pm*100)}%"></i></s></div>`).join(""):'<div class="em">Sin datos.</div>'}</div></div>
 <div class="c tw" style="margin-top:12px"><h3>Ventas del período</h3>${all.length?`<table><thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Pago</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody>${all.slice(0,100).map(x=>`<tr><td>${x.numero}</td><td>${fd(x.created_at)}</td><td>${esc(x.clientes?x.clientes.nombre:"Consumidor final")}</td><td>${esc(x.metodo_pago)}</td><td>${$$(x.total)}</td><td><span class="tag ${x.estado==="anulada"?"out":"ok"}">${x.estado}</span></td><td>${x.estado==="completada"?`<button class="btn g s adm" data-v="${x.id}">Anular</button>`:""}</td></tr>`).join("")}</tbody></table>`:'<div class="em">No hay ventas en estas fechas.</div>'}</div>`}
$("r1").onchange=rRep;$("r2").onchange=rRep;
$("rep").onclick=async e=>{const b=e.target.closest("button[data-v]");if(!b||!confirm("¿Anular esta venta? El stock se devolverá al inventario."))return;try{await ok(db.rpc("anular_venta",{p_venta:b.dataset.v}));await loadAll();rRep();toast("Venta anulada y stock devuelto")}catch(x){}};

/* ---------- Historial ---------- */
async function rHis(){const f=$("hf").value;let q=db.from("movimientos_stock").select("created_at,tipo,cantidad,stock_resultante,nota,productos(nombre),profiles(nombre)").order("created_at",{ascending:false}).limit(200);if(f)q=q.eq("tipo",f);const l=await ok(q);
 $("his").innerHTML=l.length?`<table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Stock final</th><th>Usuario</th><th>Nota</th></tr></thead><tbody>${l.map(m=>`<tr><td>${fd(m.created_at)}</td><td>${esc(m.productos?m.productos.nombre:"—")}</td><td><span class="tag ${m.cantidad>0?"ok":"low"}">${esc(m.tipo)}</span></td><td>${m.cantidad>0?"+":""}${m.cantidad}</td><td>${m.stock_resultante}</td><td>${esc(m.profiles?m.profiles.nombre:"—")}</td><td>${esc(m.nota||"—")}</td></tr>`).join("")}</tbody></table>`:'<div class="em">Todavía no hay movimientos. Aparecerán aquí cada vez que agregues stock o hagas una venta.</div>'}
$("hf").onchange=rHis;
})();
</script></body></html>
