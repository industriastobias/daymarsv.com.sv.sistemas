<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B2D3E"><meta name="robots" content="noindex,nofollow"><title>DAYMARSV – Inicio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/estilo.css?v=202610301137">
<style>
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.top h1{font-size:26px;line-height:1.15}.top small{color:var(--mute);display:block;text-transform:capitalize}
.who{display:flex;align-items:center;gap:8px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.kp a{display:block;text-decoration:none;color:inherit}.kp a .c{height:100%;box-sizing:border-box}
.kp .c b{font-size:24px}
.gt{font:700 13px "DM Sans",sans-serif;color:var(--mute);margin:18px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:500;text-align:center;position:relative}
.tile .ic{width:30px;height:30px;color:var(--wine)}
.tile.off{opacity:.55}.tile.off:after{content:"Pronto";position:absolute;top:6px;right:8px;font-size:10px;color:var(--mute)}
.tile:active{background:var(--chip)}
@media(min-width:800px){
 main{max-width:1240px;margin:0}
 .tiles,.kp{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
 .tile{align-items:flex-start;text-align:left;padding:16px;min-height:96px;font-size:14px}
 .tile:hover{border-color:var(--wine)}
}
@media(min-width:800px){.top h1{font-size:30px}}
</style><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest?v=202610301137"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DAYMARSV"></head><body>
<div class="shell hidden" id="app">
<aside class="side" id="side" aria-label="Navegación principal"></aside>
<main>
<div class="top"><div><h1 id="gr">Hola</h1><small id="dt"></small></div>
<div class="who"><button class="av" id="av" title="Configuración" aria-label="Configuración">?</button></div></div>
<div class="kp"><a href="almacenamiento.html#hoy"><div class="c"><b id="s1">—</b><span>Ventas de hoy</span></div></a><a href="reportes.html"><div class="c w"><b id="s2">—</b><span>Productos con stock bajo</span></div></a></div>
<div id="mods"></div>
</main></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js?v=202610301137"></script>
<script>
(async()=>{const {db,esc,$$,ymd,toast,logout,requireSession,toggleTheme,GRUPOS,svg,visibles,enlace,mountSide}=DAY,$=i=>document.getElementById(i);
const me=await requireSession();if(!me)return;
$("app").classList.remove("hidden");
const hr=new Date().getHours(),saludo=()=>{$("gr").textContent=(hr<12?"Buenos días":hr<19?"Buenas tardes":"Buenas noches")+", "+DAY.me.nombre;$("av").innerHTML=DAY.me.avatar?`<img src="${esc(DAY.me.avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:esc((DAY.me.nombre||"?").charAt(0).toUpperCase())};saludo();addEventListener("day:perfil",saludo);
$("dt").textContent=new Date().toLocaleDateString("es-SV",{weekday:"long",day:"numeric",month:"long"});
$("mods").innerHTML=GRUPOS.filter(g=>visibles(g,me.rol).length).map(g=>`<div class="gt">${g.t}</div><div class="tiles">${visibles(g,me.rol).map(x=>enlace(x,"tile")).join("")}</div>`).join("");
mountSide($("side"),"menu",me.rol);
const unaVez=(k,firma)=>{const h=ymd(new Date());try{const v=localStorage.getItem(k)||"";if(v===h+"|"+firma)return false;localStorage.setItem(k,h+"|"+firma)}catch(e){}return true};

document.addEventListener("click",e=>{const a=e.target.closest("#mods [data-n]");if(a){e.preventDefault();toast(a.dataset.n+" se conectará a la base de datos pronto.")}});
$("av").onclick=DAY.abrirConfig;
if(me.rol==="admin")try{const d=new Date(Date.now()-7*864e5).toISOString();let {data}=await db.from("accesos").select("nombre,dispositivo,navegador,created_at").eq("nuevo",true).eq("exito",true).gte("created_at",d);
 let visto="";try{visto=localStorage.getItem("dms_acc_visto")||""}catch(x){}
 if(data){const mx=data.reduce((m,x)=>x.created_at>m?x.created_at:m,"");data=data.filter(x=>!visto||x.created_at>visto);if(mx&&mx>visto){try{localStorage.setItem("dms_acc_visto",mx)}catch(x){}}}
 if(data&&data.length){const a=document.createElement("a");a.href="actividad.html";a.style.cssText="display:block;margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));color:var(--ink);text-decoration:none;font-size:14px";a.innerHTML="<b>🔐 "+data.length+" inicio(s) de sesión desde un dispositivo nuevo esta semana</b><br><small>Toca para revisarlos en Actividad.</small>";$("mods").before(a)}}catch(e){}
try{const lim=new Date(Date.now()+2*864e5),li=lim.getFullYear()+"-"+String(lim.getMonth()+1).padStart(2,"0")+"-"+String(lim.getDate()).padStart(2,"0"),{data:rv}=await db.from("reservas").select("vence").eq("estado","pendiente").is("cancelada_en",null).not("vence","is",null).lte("vence",li);
 if(rv&&rv.length&&unaVez("dms_res_visto",String(rv.length))){const hy=ymd(new Date()),ve=rv.filter(x=>x.vence<hy).length,pr=rv.length-ve,a=document.createElement("a");a.href="reservas.html";a.style.cssText="display:block;margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));color:var(--ink);text-decoration:none;font-size:14px";
  a.innerHTML="<b>📅 "+(ve?ve+" reserva(s) vencida(s)":"")+(ve&&pr?" y ":"")+(pr?pr+" por vencer en 2 días":"")+"</b><br><small>Toca para ver las reservas.</small>";$("mods").before(a)}}catch(e){}
try{const [v,p]=await Promise.all([db.from("vista_ventas_diarias").select("total").eq("fecha",ymd(new Date())),db.from("productos").select("stock,stock_minimo").eq("activo",true)]);
 $("s1").textContent=$$((v.data||[]).reduce((a,x)=>a+(+x.total||0),0));const PL=p.data||[];$("s2").textContent=PL.filter(x=>x.stock<=x.stock_minimo).length;
 const ag=PL.filter(x=>x.stock<=0).length,ba=PL.filter(x=>x.stock>0&&x.stock<=x.stock_minimo).length;
 if((ag||ba)&&unaVez("dms_stk_visto",ag+"/"+ba)){const a=document.createElement("a");a.href="reportes.html";a.style.cssText="display:block;margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));color:var(--ink);text-decoration:none;font-size:14px";
  a.innerHTML="<b>📦 "+(ag?ag+" producto(s) agotado(s)":"")+(ag&&ba?" y ":"")+(ba?ba+" con stock bajo":"")+"</b><br><small>Toca para ver el inventario.</small>";$("mods").before(a)}}catch(e){}
})();
</script></body></html>
