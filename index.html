<div class="col">
<form class="lc" id="lf">
 <h2 id="ht">¡Hola de nuevo!</h2><p class="sub" id="hs">Inicia sesión para continuar.</p>
 <div class="fld"><input id="u" type="email" autocomplete="username" required placeholder=" "><label for="u">Correo</label></div>
 <div class="fld"><input id="p" type="password" autocomplete="current-password" required placeholder=" "><label for="p">Contraseña</label><button type="button" id="eye" aria-label="Mostrar contraseña">Mostrar</button></div>
 <div id="rg" class="hidden"><div class="fld"><input id="rn" autocomplete="name" maxlength="60" placeholder=" "><label for="rn">Tu nombre</label></div>
 <div class="fld"><input id="p2" type="password" autocomplete="new-password" placeholder=" "><label for="p2">Repite la contraseña</label></div></div>
 <div class="err" id="le" role="alert"></div><button class="btn" id="lb">Ingresar</button>
  <button type="button" id="fg" class="tg">¿Olvidaste tu contraseña?</button>
  <button type="button" id="tg" class="tg hidden">¿Te invitaron? Crear cuenta</button>
</form>
<form class="lc hidden" id="rf">
 <h2>Crea tu nueva contraseña</h2><p class="sub">Escribe una contraseña de al menos 8 caracteres.</p>
 <div class="fld"><input id="n1" type="password" autocomplete="new-password" required placeholder=" "><label for="n1">Nueva contraseña</label></div>
 <div class="fld"><input id="n2" type="password" autocomplete="new-password" required placeholder=" "><label for="n2">Repite la contraseña</label></div>
 <div class="err" id="re" role="alert"></div><button class="btn" id="rb">Guardar contraseña</button>
</form>
</div></div>
<div class="lx-ft"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg><span>Conexión segura · Acceso solo para usuarios autorizados</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js?v=202611211700"></script>
<script>
(async()=>{const {db}=DAY,$=i=>document.getElementById(i);
if(location.search.indexOf("e=perfil")>-1)$("le").textContent="No se encontró tu perfil o tu usuario está desactivado. Habla con el administrador.";
else if(location.search.indexOf("e=cerrada")>-1){$("le").style.color="var(--info)";$("le").textContent="El administrador cerró tu sesión. Inicia sesión de nuevo."}
else if(/type=recovery/.test(location.hash)||/[?&]recuperar=1/.test(location.search)){}
else{const s=await DAY.sesionActual();if(s&&s!=="red")location.replace("menu.html");else if(s==="red"){$("le").style.color="var(--info)";$("le").innerHTML='Sin conexión: tu sesión sigue abierta. <a href="menu.html" style="color:inherit;font-weight:700">Reintentar</a>'}}

const REC=/type=recovery/.test(location.hash);
if(/error_code=otp_expired|error=access_denied/.test(location.hash)){$("le").textContent="El enlace venció o ya se usó. Pide otro con «¿Olvidaste tu contraseña?»."}
if(REC){$("lf").classList.add("hidden");$("rf").classList.remove("hidden");$("le").textContent=""}
$("fg").onclick=async()=>{const email=$("u").value.trim();$("le").style.color="";
 if(!email){$("le").textContent="Escribe tu correo arriba y vuelve a pulsar «¿Olvidaste tu contraseña?».";$("u").focus();return}
 $("fg").disabled=true;
 const cta=await db.rpc("correo_tiene_cuenta",{p_email:email}).then(r=>r,()=>({error:1}));
 if(!cta.error&&cta.data===false){$("fg").disabled=false;$("le").textContent="Ese correo no tiene cuenta en el sistema. Solo pueden entrar usuarios autorizados por el administrador.";return}
 const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});$("fg").disabled=false;
 if(error&&/rate|seconds|limit/i.test(error.message)){$("le").textContent="Espera unos minutos antes de pedir otro enlace.";return}
 $("le").style.color="var(--ok)";$("le").textContent=cta.error?"Si ese correo tiene cuenta, te enviamos un enlace para crear una nueva contraseña. Revisa también el spam.":"Te enviamos un enlace a ese correo para crear una nueva contraseña. Revisa también el spam."};
$("rf").onsubmit=async e=>{e.preventDefault();const a=$("n1").value,b=$("n2").value;$("re").textContent="";
 if(a.length<8){$("re").textContent="La contraseña debe tener al menos 8 caracteres.";return}
 if(a!==b){$("re").textContent="Las contraseñas no coinciden.";return}
 $("rb").disabled=true;const {error}=await db.auth.updateUser({password:a});$("rb").disabled=false;
 if(error){$("re").textContent=/same|different/i.test(error.message)?"Usa una contraseña distinta a la anterior.":/session|jwt|expired/i.test(error.message)?"El enlace venció. Pide otro desde «¿Olvidaste tu contraseña?».":error.message;return}
 history.replaceState(null,"",location.pathname);location.replace("menu.html")};
let reg=false;
const disp=(()=>{const u=navigator.userAgent,t=navigator.maxTouchPoints>1;
 const dispositivo=/iPad|Tablet/i.test(u)||(/Macintosh/.test(u)&&t)?"Tablet":/Mobi|iPhone|Android.*Mobile/i.test(u)?"Celular":"Computadora";
 const sistema=/iPhone|iPad/.test(u)||(/Macintosh/.test(u)&&t)?"iOS":/Android/.test(u)?"Android":/Windows/.test(u)?"Windows":/Mac OS/.test(u)?"macOS":/Linux/.test(u)?"Linux":"Otro";
 const navegador=/Edg\//.test(u)?"Edge":/OPR\//.test(u)?"Opera":/Chrome|CriOS/.test(u)?"Chrome":/Firefox|FxiOS/.test(u)?"Firefox":/Safari/.test(u)?"Safari":"Otro";
 let id="";try{id=localStorage.getItem("dms_dev")||"";if(!id){id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());localStorage.setItem("dms_dev",id)}}catch(e){}
 return {dispositivo,sistema,navegador,huella:id||(dispositivo+sistema+navegador)}})();
const conTope=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
if(/[?&]registro=1/.test(location.search))$("tg").classList.remove("hidden");
$("eye").onclick=()=>{const s=$("p").type==="password";$("p").type=s?"text":"password";$("eye").textContent=s?"Ocultar":"Mostrar"};
$("tg").onclick=()=>{reg=!reg;$("ht").textContent=reg?"Crea tu cuenta":"¡Hola de nuevo!";$("hs").textContent=reg?"Usa el correo con el que te invitaron.":"Inicia sesión para continuar.";$("rg").classList.toggle("hidden",!reg);$("lb").textContent=reg?"Crear cuenta":"Ingresar";$("tg").textContent=reg?"Ya tengo cuenta: iniciar sesión":"¿Te invitaron? Crear cuenta";$("p").autocomplete=reg?"new-password":"current-password";$("le").textContent="";$("le").style.color=""};
$("lf").onsubmit=async e=>{e.preventDefault();$("le").textContent="";$("le").style.color="";$("lb").disabled=true;
 const email=$("u").value.trim(),password=$("p").value;
 if(reg){
  if(password.length<8){$("le").textContent="La contraseña debe tener al menos 8 caracteres.";$("lb").disabled=false;return}
  if(password!==$("p2").value){$("le").textContent="Las contraseñas no coinciden.";$("lb").disabled=false;return}
  const {data,error}=await db.auth.signUp({email,password,options:{data:{nombre:$("rn").value.trim()}}});$("lb").disabled=false;
  if(error){$("le").textContent=/database error|invitaci/i.test(error.message)?"Ese correo no tiene invitación. Pide al administrador principal que te invite.":/already|registered/i.test(error.message)?"Ese correo ya tiene una cuenta. Inicia sesión.":error.message;return}
  if(data.session){await conTope(db.rpc("registrar_acceso",{p_dispositivo:disp.dispositivo,p_sistema:disp.sistema,p_navegador:disp.navegador,p_huella:disp.huella}),2500).catch(()=>{});location.replace("menu.html");return}
  $("le").style.color="var(--ok)";$("le").textContent="Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.";return}
 const {error}=await db.auth.signInWithPassword({email,password});$("lb").disabled=false;
 if(error){$("le").textContent=/invalid login/i.test(error.message)?"Correo o contraseña incorrectos.":error.message;if(/invalid login/i.test(error.message))db.rpc("registrar_acceso_fallido",{p_email:email,p_dispositivo:disp.dispositivo,p_sistema:disp.sistema,p_navegador:disp.navegador}).then(()=>{},()=>{});return}
 await conTope(db.rpc("registrar_acceso",{p_dispositivo:disp.dispositivo,p_sistema:disp.sistema,p_navegador:disp.navegador,p_huella:disp.huella}),2500).catch(()=>{});
 location.replace("menu.html")}
})();
</script></body></html>
