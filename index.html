<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B2D3E"><meta name="robots" content="noindex,nofollow"><title>DAYMAR-SHOP – Iniciar sesión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/estilo.css?v=202610281613"><link rel="stylesheet" href="css/login.css?v=202610281613"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<div class="lx"><i class="o o1"></i><i class="o o2"></i><i class="o o3"></i>
<form class="lc" id="lf">
 <div class="lc-logo"><img src="logo.png" alt="DAYMAR"></div>
 <div class="lc-brand">DAYMAR<i>-SHOP</i></div><div class="lc-sl">A Family Company</div>
 <h2 id="ht">Bienvenido</h2><p class="sub" id="hs">Inicia sesión para continuar.</p>
 <div class="fld"><input id="u" type="email" autocomplete="username" required placeholder=" "><label for="u">Correo</label></div>
 <div class="fld"><input id="p" type="password" autocomplete="current-password" required placeholder=" "><label for="p">Contraseña</label><button type="button" id="eye" aria-label="Mostrar contraseña">Mostrar</button></div>
 <div id="rg" class="hidden"><div class="fld"><input id="rn" autocomplete="name" maxlength="60" placeholder=" "><label for="rn">Tu nombre</label></div>
 <div class="fld"><input id="p2" type="password" autocomplete="new-password" placeholder=" "><label for="p2">Repite la contraseña</label></div></div>
 <div class="err" id="le" role="alert"></div><button class="btn" id="lb">Ingresar</button>
  <button type="button" id="tg" class="tg hidden">¿Te invitaron? Crear cuenta</button>
</form>
<div class="lx-ft">© DAYMAR-SHOP · Acceso solo para usuarios autorizados</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js?v=202610281613"></script>
<script>
(async()=>{const {db}=DAY,$=i=>document.getElementById(i);
if(location.search.indexOf("e=perfil")>-1)$("le").textContent="No se encontró tu perfil o tu usuario está desactivado. Habla con el administrador.";
else{const {data}=await db.auth.getSession();if(data.session)location.replace("menu.html")}
let reg=false;
const disp=(()=>{const u=navigator.userAgent,t=navigator.maxTouchPoints>1;
 const dispositivo=/iPad|Tablet/i.test(u)||(/Macintosh/.test(u)&&t)?"Tablet":/Mobi|iPhone|Android.*Mobile/i.test(u)?"Celular":"Computadora";
 const sistema=/iPhone|iPad/.test(u)||(/Macintosh/.test(u)&&t)?"iOS":/Android/.test(u)?"Android":/Windows/.test(u)?"Windows":/Mac OS/.test(u)?"macOS":/Linux/.test(u)?"Linux":"Otro";
 const navegador=/Edg\//.test(u)?"Edge":/OPR\//.test(u)?"Opera":/Chrome|CriOS/.test(u)?"Chrome":/Firefox|FxiOS/.test(u)?"Firefox":/Safari/.test(u)?"Safari":"Otro";
 let id="";try{id=localStorage.getItem("dms_dev")||"";if(!id){id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());localStorage.setItem("dms_dev",id)}}catch(e){}
 return {dispositivo,sistema,navegador,huella:id||(dispositivo+sistema+navegador)}})();
const conTope=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
if(/[?&]registro=1/.test(location.search))$("tg").classList.remove("hidden");
$("eye").onclick=()=>{const s=$("p").type==="password";$("p").type=s?"text":"password";$("eye").textContent=s?"Ocultar":"Mostrar"};
$("tg").onclick=()=>{reg=!reg;$("ht").textContent=reg?"Crea tu cuenta":"Bienvenido";$("hs").textContent=reg?"Usa el correo con el que te invitaron.":"Inicia sesión para continuar.";$("rg").classList.toggle("hidden",!reg);$("lb").textContent=reg?"Crear cuenta":"Ingresar";$("tg").textContent=reg?"Ya tengo cuenta: iniciar sesión":"¿Te invitaron? Crear cuenta";$("p").autocomplete=reg?"new-password":"current-password";$("le").textContent="";$("le").style.color=""};
$("lf").onsubmit=async e=>{e.preventDefault();$("le").textContent="";$("le").style.color="";$("lb").disabled=true;
 const email=$("u").value.trim(),password=$("p").value;
 if(reg){
  if(password.length<8){$("le").textContent="La contraseña debe tener al menos 8 caracteres.";$("lb").disabled=false;return}
  if(password!==$("p2").value){$("le").textContent="Las contraseñas no coinciden.";$("lb").disabled=false;return}
  const {data,error}=await db.auth.signUp({email,password,options:{data:{nombre:$("rn").value.trim()}}});$("lb").disabled=false;
  if(error){$("le").textContent=/database error|invitaci/i.test(error.message)?"Ese correo no tiene invitación. Pide al administrador principal que te invite.":/already|registered/i.test(error.message)?"Ese correo ya tiene una cuenta. Inicia sesión.":error.message;return}
  if(data.session){await conTope(db.rpc("registrar_acceso",{p_dispositivo:disp.dispositivo,p_sistema:disp.sistema,p_navegador:disp.navegador,p_huella:disp.huella}),2500).catch(()=>{});location.replace("menu.html");return}
  $("le").style.color="var(--ok)";$("le").textContent="Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.";return}
 const {error}=await db.auth.signInWithPassword({email,password});$("lb").disabled=false;
 if(error){$("le").textContent=/invalid login/i.test(error.message)?"Correo o contraseña incorrectos.":error.message;if(/invalid login/i.test(error.message))db.rpc("registrar_acceso_fallido",{p_email:email,p_dispositivo:disp.dispositivo,p_sistema:disp.sistema,p_navegador:disp.navegador}).then(()=>{},()=>{});return}
 await conTope(db.rpc("registrar_acceso",{p_dispositivo:disp.dispositivo,p_sistema:disp.sistema,p_navegador:disp.navegador,p_huella:disp.huella}),2500).catch(()=>{});
 location.replace("menu.html")}
})();
</script></body></html>
