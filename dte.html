<html lang="es" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B2D3E"><meta name="robots" content="noindex,nofollow"><title>DAYMARSV – Factura electrónica</title>

<style>
.dbh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.dbh h1{margin:0;font-size:26px}.dbh small{color:var(--mute);display:block}
.dbk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:4px solid var(--wine)}
.kc span{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kc b{display:block;font-size:24px;margin-top:4px;font-family:"Bricolage Grotesque",sans-serif}
.kc small{color:var(--mute);font-size:12px}
.kc.g{border-left-color:var(--gold)}.kc.o{border-left-color:var(--ok)}.kc.w{border-left-color:var(--warn)}
.gr{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-bottom:14px}
.pn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;grid-column:span 6;min-width:0}
.pn.s4{grid-column:span 4}.pn.s8{grid-column:span 8}.pn.s12{grid-column:span 12}
.pn h3{margin:0 0 10px;font-size:15px}
.cv{position:relative;height:250px}
@media(max-width:900px){.pn,.pn.s4,.pn.s8{grid-column:span 12}}
.tbc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tbc input,.tbc select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.tbc input{flex:1;min-width:170px;width:auto}.tbc select{width:auto;flex:0 1 auto}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px}
table.xl{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
.xl th{position:sticky;top:0;background:var(--chip);text-align:left;padding:9px 10px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);z-index:1}
.xl th.r,.xl td.r{text-align:right;font-variant-numeric:tabular-nums}
.xl td{padding:7px 10px;border-bottom:1px solid var(--line)}
.xl tbody tr:nth-child(even){background:color-mix(in srgb,var(--chip) 45%,transparent)}
.xl tbody tr:hover{background:var(--chip)}
.xl td .im{width:30px;height:30px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:8px;background:var(--chip)}
.bd{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.bd.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.bd.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bd.b{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.ft{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px;color:var(--mute);font-size:13px;flex-wrap:wrap}
.rb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.rb .seg2{overflow-x:auto}.rf{display:flex;gap:6px}.rf input{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.dlt{display:block;font-style:normal;font-size:12px;margin-top:2px}.dlt.dup{color:var(--ok)}.dlt.ddn{color:var(--bad)}
.mts{margin-bottom:14px}.mhd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.mhd h3{margin:0}
.mtg{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.mtg{grid-template-columns:1fr}}
.mh{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px;flex-wrap:wrap}.mpb{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}.mpb i{display:block;height:100%;background:var(--gold);border-radius:999px}.mpb i.ok{background:var(--ok)}.mt small{color:var(--mute);font-size:12px}
.hint{color:var(--mute);font-size:13px;margin:0 0 8px}.sml{font-size:13px;color:var(--mute)}.sml select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;width:auto}
.nod{color:var(--mute);text-align:center;padding:60px 0;font-size:14px}
.pl{color:var(--wine);font-weight:600;text-decoration:none}.mp{color:var(--ok);font-weight:700}.mm{color:var(--bad);font-weight:700}
.tbc input,.tbc select{width:auto!important}.tbc input[type=search]{flex:1 1 220px}
.aviso{background:#fff7e6;border:1px solid #f0d49a;color:#7a5200;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:14px}
.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}@media(max-width:700px){.pasos{grid-template-columns:1fr 1fr}}
.paso{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}.paso b{display:block;font-size:13px;margin-bottom:2px}.paso small{color:var(--mute)}.paso.no{opacity:.55}
.vl{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}.vl:last-child{border:0}.vl .ti{flex:1;min-width:150px}.vl small{color:var(--mute)}
.json{background:#1e1a1c;color:#f3e9ec;border-radius:12px;padding:12px;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:55vh;overflow:auto;white-space:pre;margin:0}
</style></head><body>
<div class="shell hidden" id="app">
<aside class="side" id="side" aria-label="Navegación principal"></aside>
<main class="wide">
 <div class="head"><a class="back" href="almacenamiento.html#fac">‹ Facturas</a><div><h1>Factura electrónica</h1></div><div class="hact"><button class="btn g" id="bEm" type="button">Datos del emisor</button></div></div>
 <div id="dash"><div class="nod">Cargando…</div></div>
</main></div>
<div class="ov" id="ov"><div><span class="spin"></span><span id="ovT">Procesando…</span></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>

</body></html>
