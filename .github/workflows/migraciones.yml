name: Aplicar migraciones a Supabase
on:
  push:
    branches: [main]
    paths: ['migraciones/**.sql']
  workflow_dispatch:
concurrency: migraciones
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar las migraciones nuevas
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          if [ -z "$DB" ]; then echo "Falta el secreto SUPABASE_DB_URL"; exit 1; fi
          psql "$DB" -v ON_ERROR_STOP=1 -q -c "create table if not exists public._migraciones_aplicadas (archivo text primary key, aplicada_en timestamptz not null default now()); alter table public._migraciones_aplicadas enable row level security;"
          for f in $(ls migraciones/*.sql | sort); do
            n=$(basename "$f")
            ya=$(psql "$DB" -tA -c "select 1 from public._migraciones_aplicadas where archivo='$n'")
            if [ "$ya" = "1" ]; then echo "ya aplicada: $n"; continue; fi
            echo "aplicando: $n"
            psql "$DB" -v ON_ERROR_STOP=1 --single-transaction -q -f "$f"
            psql "$DB" -v ON_ERROR_STOP=1 -q -c "insert into public._migraciones_aplicadas(archivo) values ('$n')"
          done
          echo "Listo."
