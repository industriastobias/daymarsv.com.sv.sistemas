name: Respaldo semanal de la base de datos
on:
  schedule:
    - cron: '17 9 * * 0'   # domingos 3:17 a. m. (El Salvador)
  workflow_dispatch:
concurrency: respaldo
jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Crear el respaldo cifrado
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          set -e
          if [ -z "$DB" ]; then echo "Falta el secreto SUPABASE_DB_URL"; exit 1; fi
          if [ -z "$CLAVE" ] || [ ${#CLAVE} -lt 12 ]; then echo "Falta el secreto RESPALDO_CLAVE (mínimo 12 caracteres)"; exit 1; fi
          F="respaldo_$(date -u +%Y-%m-%d)"
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --no-owner --no-privileges -T public.config_correo -f "$F.sql"
          gzip -9 "$F.sql"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CLAVE -in "$F.sql.gz" -out "$F.sql.gz.enc"
          rm "$F.sql.gz"
          ls -l "$F.sql.gz.enc"
      - name: Guardar el respaldo (archivo cifrado, 60 días)
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-cifrado
          path: respaldo_*.sql.gz.enc
          retention-days: 60
